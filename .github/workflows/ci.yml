name: GenViet CI Quality Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-checks:
    name: Code Quality, Static Analysis & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install Dependencies (Frozen Lockfile)
        run: npm ci

      - name: Run Format Verification
        run: npm run format:check

      - name: Run ESLint Static Analysis
        run: npm run lint

      - name: Run TypeScript Strict Typecheck
        run: npm run typecheck

      - name: Run Vitest Unit Test Suite
        run: npm run test:run

      - name: Build Next.js Production Application
        run: npm run build

  e2e-smoke-tests:
    name: Playwright End-to-End Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [quality-checks]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Chromium Browser
        run: npx playwright install --with-deps chromium

      - name: Build Next.js Production Application
        run: npm run build

      - name: Run Playwright E2E Smoke Tests
        run: npm run test:e2e
